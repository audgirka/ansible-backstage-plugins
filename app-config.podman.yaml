signInPage: rhaap
enableExperimentalRedirectFlow: true

app:
  title: Ansible Portal - Local Dev
  baseUrl: http://localhost:7007

backend:
  auth:
    keys:
      - secret: development-secret-do-not-use-in-production
  baseUrl: http://localhost:7007
  listen:
    host: 0.0.0.0
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    upgrade-insecure-requests: false
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    rhaap:
      development:
        host: ${AAP_HOST:-https://aap.example.com}
        checkSSL: false
        clientId: ${AAP_AUTH_CLIENT_ID}
        clientSecret: ${AAP_AUTH_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: allowNewAAPUserSignIn

dynamicPlugins:
  rootDirectory: dynamic-plugins-root
  frontend:
    ansible.plugin-backstage-self-service:
      signInPage:
        importName: SignInPage
      providerSettings:
        - title: RHAAP
          description: Sign in with RHAAP
          provider: ansible.auth.rhaap
      scaffolderFieldExtensions:
        - importName: AAPTokenFieldExtension
        - importName: AAPResourcePickerExtension
        - importName: AdditionalBuildStepsPickerFieldExtension
        - importName: BaseImagePickerFieldExtension
        - importName: CollectionsPickerFieldExtension
        - importName: EEFileNamePickerExtension
        - importName: FileUploadPickerFieldExtension
        - importName: PackagesPickerFieldExtension
        - importName: MCPServersPickerFieldExtension
        - importName: ScmSelectorFieldExtension
      dynamicRoutes:
        - importName: LandingPage
          path: /
        - importName: SelfServicePage
          path: /self-service
        - importName: TemplatesPage
          path: /self-service/*
          menuItem:
            importName: TemplatesSidebarItem
        - importName: HistoryPage
          path: /self-service/create/tasks
          menuItem:
            importName: HistorySidebarItem
        - importName: EEPage
          path: /self-service/ee/*
        - importName: EEPage
          path: /self-service/ee
          menuItem:
            importName: EEBuilderSidebarItem
        - importName: CollectionsPage
          path: /self-service/collections
          menuItem:
            importName: CollectionsSidebarItem
        - importName: CollectionsPage
          path: /self-service/collections/*
        - importName: GitRepositoriesPage
          path: /self-service/repositories
          menuItem:
            importName: GitRepositoriesSidebarItem
        - importName: GitRepositoriesPage
          path: /self-service/repositories/*
      mountPoints:
        - mountPoint: application/listener
          importName: LocationListener
        - mountPoint: application/listener
          importName: AppThemeFixer
        - importName: AAPLogoutButton
          mountPoint: global.header/profile
          config:
            priority: 100

ansible:
  auth:
    enabledProviders:
      - rhaap
      - guest
      - github
      - gitlab
  rhaap:
    baseUrl: ${AAP_HOST:-https://aap.example.com}
    token: ${AAP_API_TOKEN:-placeholder}
    checkSSL: false
  creatorService:
    baseUrl: localhost
    port: '8000'

permission:
  enabled: true
  rbac:
    # if you want to use a csv file for rbac, uncomment the following lines.
    # Refer default-rbac-policy.csv for the policy file.
    # policies-csv-file: /Users/audgirka/src/ansible-backstage-plugins/default-rbac-policy.csv
    # policyFileReload: true
    admin:
      users:
        - name: user:default/admin              
        - name: group:default/aap-admins        
      superUsers:
        - name: user:default/admin              
        - name: group:default/aap-admins        
    # Plugins that require permission evaluation
    pluginsWithPermission:
      - catalog
      - scaffolder
      - permission

catalog:
  providers:
    rhaap:
      dev:
        baseUrl: ${AAP_HOST:-https://aap.example.com}
        authorization: Bearer ${AAP_API_TOKEN:-placeholder}
        checkSSL: false
        orgs: Default
        sync:
          orgsUsersTeams:
            schedule:
              frequency: { minutes: 2 }
              timeout: { seconds: 30 }
          jobTemplates:
            enabled: true
            schedule:
              frequency: { minutes: 1 }
              timeout: { seconds: 30 }
  rules:
    - allow:
        - Component
        - System
        - Group
        - Resource
        - Location
        - Template
        - API

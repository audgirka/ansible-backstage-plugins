signInPage: rhaap
enableExperimentalRedirectFlow: true

app:
  title: Ansible Portal - Local Dev
  baseUrl: http://localhost:7007

backend:
  auth:
    keys:
      - secret: development-secret-do-not-use-in-production
  baseUrl: http://localhost:7007
  listen:
    host: 0.0.0.0
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    upgrade-insecure-requests: false
  cors:
    origin: http://localhost:7007
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

auth:
  environment: development
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true
    rhaap:
      development:
        host: ${AAP_HOST:-https://aap.example.com}
        checkSSL: false
        clientId: ${AAP_AUTH_CLIENT_ID}
        clientSecret: ${AAP_AUTH_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: allowNewAAPUserSignIn

dynamicPlugins:
  rootDirectory: dynamic-plugins-root
  frontend:
    default.main-menu-items:
      menuItems:
        default.home:
          title: ''
          icon: home
          to: /
          priority: 90
        default.catalog:
          title: ''
          icon: category
          to: catalog
          priority: 80
        default.my-group:
          title: ''
          icon: group
          priority: 70
        default.apis:
          title: ''
          icon: extension
          to: api-docs
          priority: 60
        default.learning-path:
          title: ''
          icon: school
          to: learning-paths
          priority: 50
        default.create:
          title: ''
          icon: add
          to: create
          priority: 40

ansible:
  auth:
    enabledProviders:
      - rhaap
      - guest
      - github
      - gitlab
  rhaap:
    baseUrl: ${AAP_HOST:-https://aap.example.com}
    token: ${AAP_API_TOKEN:-placeholder}
    checkSSL: false
  creatorService:
    baseUrl: localhost
    port: '8000'

permission:
  enabled: true
  rbac:
    # if you want to use a csv file for rbac, uncomment the following lines.
    # Refer default-rbac-policy.csv for the policy file.
    # policies-csv-file: /Users/audgirka/src/ansible-backstage-plugins/default-rbac-policy.csv
    # policyFileReload: true
    admin:
      users:
        - name: user:default/admin              
        - name: group:default/aap-admins        
      superUsers:
        - name: user:default/admin              
        - name: group:default/aap-admins        
    # Plugins that require permission evaluation
    pluginsWithPermission:
      - catalog
      - scaffolder
      - permission

catalog:
  providers:
    rhaap:
      dev:
        baseUrl: ${AAP_HOST:-https://aap.example.com}
        authorization: Bearer ${AAP_API_TOKEN:-placeholder}
        checkSSL: false
        orgs: Default
        sync:
          orgsUsersTeams:
            schedule:
              frequency: { minutes: 2 }
              timeout: { seconds: 30 }
          jobTemplates:
            enabled: true
            schedule:
              frequency: { minutes: 1 }
              timeout: { seconds: 30 }
  rules:
    - allow:
        - Component
        - System
        - Group
        - Resource
        - Location
        - Template
        - API
